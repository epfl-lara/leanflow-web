name: CI

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main, dev]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CYPRESS_INSTALL_BINARY: '0'

jobs:
  checks:
    name: Linux / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check changed-file formatting
        if: matrix.node == 24
        run: node scripts/ci/check-format.mjs
      - name: Check Python packaging
        if: matrix.node == 24
        run: |
          python3 -m venv .runtime/python-tools
          .runtime/python-tools/bin/pip install black==25.1.0
          .runtime/python-tools/bin/black --check scripts/package-lemex.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Test
        run: |
          npm test
          node --test scripts/ten-proofs-fixture.test.mjs
      - name: Typecheck
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Audit production dependencies
        if: matrix.node == 24
        run: npm audit --omit=dev --audit-level=high
      - name: Build client
        run: npm run build
      - name: Save client for browser checks and release packaging
        if: matrix.node == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-dist
          path: client/dist/
          if-no-files-found: error
          retention-days: 7

  workflows:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check workflow syntax and shell commands
        run: bash scripts/ci/check-workflows.sh

  browser:
    name: Browser regressions
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client-dist
          path: client/dist
      - run: npx --no-install playwright install --with-deps chromium
      - name: Check isolated browser flows
        run: node scripts/ci/check-browser.mjs
      - name: Save fixture reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-reports
          path: |
            .runtime/auth-recovery-ui/
            .runtime/provider-settings-ui/
            .runtime/model-options-ui/
            .runtime/chat-naming-ui/
            .runtime/chat-ui/
            .runtime/streaming-ui/
            .runtime/ask-search-ui/
            .runtime/markdown-security-ui/
            .runtime/chat-readability-ui/
            .runtime/chat-compact-ui/
            .runtime/reasoning-ui/
            .runtime/reasoning-timeline-ui/
            .runtime/reasoning-history-ui/
            .runtime/autosave-ui/
            .runtime/lean-cache-ui/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  ready:
    name: CI passed
    if: always()
    needs: [checks, workflows, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check
        env:
          CHECKS: ${{ needs.checks.result }}
          WORKFLOWS: ${{ needs.workflows.result }}
          BROWSER: ${{ needs.browser.result }}
        run: test "$CHECKS" = success && test "$WORKFLOWS" = success && test "$BROWSER" = success
