name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  source:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require main history and matching version tag
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_NAME: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            [[ "$RELEASE_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
            test "$RELEASE_NAME" = "v$(node -p "require('./package.json').version")"
          else
            test "$RELEASE_REF" = refs/heads/main
          fi

  checks:
    needs: source
    uses: ./.github/workflows/ci.yml

  candidate:
    name: Build and verify release candidate
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CYPRESS_INSTALL_BINARY: '0'
      LEMEX_WORKER_IMAGE: lemex-web-worker:${{ github.sha }}
      LEAN_PROBE_TEST_IMAGE: lemex-web-worker:${{ github.sha }}
      STUDIO_DATA_DIR: .runtime/release-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client-dist
          path: client/dist
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Resolve and prepare latest Lemex runtime
        run: python3 scripts/package-lemex.py --target-arch x64
      - name: Build Linux x64 worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.worker
          platforms: linux/amd64
          load: true
          tags: ${{ env.LEMEX_WORKER_IMAGE }}
          cache-from: type=gha,scope=worker-linux-amd64
          cache-to: type=gha,mode=min,scope=worker-linux-amd64
      - name: Check real Lean execution and worker isolation
        run: |
          node scripts/check-runtime.mjs
          node scripts/check-worker-mount-pins.mjs
      - name: Package app, verified worker, and dependency lockfile
        run: bash scripts/ci/package-release.sh
      - name: Check a clean installation of the packaged app
        run: bash scripts/ci/check-release.sh
      - name: Save release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: .runtime/release/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  draft:
    name: Attest and prepare draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: release
      - name: Verify candidate checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tar.gz
            release/manifest.json
            release/package-lock.json
      - name: Create draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes \
            release/*.tar.gz release/SHA256SUMS release/manifest.json release/package-lock.json
